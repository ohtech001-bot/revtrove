services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-revtrove_local_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-revtrove}
      MYSQL_USER: ${MYSQL_USER:-revtrove}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-revtrove_local_password}
    ports:
      - "3306:3306"
    volumes:
      - revtrove_mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  revtrove_mysql:
